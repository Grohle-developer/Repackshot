# Engine CI: the Rust render engine in `engine/`.
#
# The engine promises to run on any OS and any CPU architecture. That promise is checked here by
# cross-compiling the whole workspace for WebAssembly (built and inspected), aarch64 and riscv64
# on every push, next to the native format, lint, test and release build.
#
# The SIMD paths that this x86_64 runner can execute (scalar, SSE2, AVX2) are tested natively;
# the WebAssembly `simd128` path is executed too, by running the rt-core tests as a
# `wasm32-wasip1` binary under Node's WASI (tools/wasi-run.mjs). NEON is compile-checked only.
# The real `rt_wasm.wasm` renders the example scene in Node and must give the film hash the native
# tests pin (tools/wasm-parity.mjs), and so must the E5 scene, the E5c physical sky, the E6 bevel
# and the E6 patterns; with every exact pass of X2 rendered next to the image, the image keeps its
# hash and each pass gives the hash the native tests pin. The AI guard's `post.wasm`
# (rt-post-wasm) runs the scenarios of tests/fixtures/ai-guard.json, which the native rt-post
# tests pin, and must give the same image bits and report JSON (tests/ai-post-wasm.test.ts). The
# contact sheet (six light recipes, then the E5 scenes and the E5c skies) is rendered and uploaded
# on every
# run. The sky simulator and fit (rt-sky) are tested here too; regenerating the sky table itself
# takes minutes (`cargo run --release -p rt-sky -- table`) and is not part of CI: a test checks that
# the committed table, its hash and the preview's copy agree.
#
# The engine also promises zero external dependencies. That rule is checked by requiring that
# Cargo.lock contains only workspace members: a `[[package]]` with a `source =` line is a crate
# from a registry or from git, and the "Zero external dependencies" step fails on it.
#
# The toolchain is pinned (RUST_VERSION, the same as the development machines): a new stable
# brings new clippy lints, and `-D warnings` would turn every release of Rust into a red CI that
# no change caused. Moving to a newer Rust is a deliberate change that fixes its new lints.
name: Engine

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: 1.97.0
  # Wins over engine/rust-toolchain.toml (channel "stable"), so every cargo call uses the pin.
  RUSTUP_TOOLCHAIN: 1.97.0

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, wasm32-wasip1, aarch64-unknown-linux-gnu, riscv64gc-unknown-linux-gnu, x86_64-pc-windows-gnu

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Zero external dependencies
        run: |
          if grep -n '^source = ' Cargo.lock; then
            echo "::error file=engine/Cargo.lock::Cargo.lock lists a crate from a registry or git. The engine must depend on nothing but the workspace crates and std."
            exit 1
          fi

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Test (release)
        run: cargo test --workspace --release

      - name: Release build of the CLI
        run: cargo build --release -p rt-cli

      - name: WebAssembly release build
        run: cargo build -p rt-wasm -p rt-post-wasm --target wasm32-unknown-unknown --release

      - name: WebAssembly binaries have no OS imports
        run: |
          for wasm in rt_wasm rt_post_wasm; do
            if grep -q wasi_snapshot_preview1 "target/wasm32-unknown-unknown/release/$wasm.wasm"; then
              echo "::error::$wasm.wasm imports WASI functions. The engine must not use OS APIs."
              exit 1
            fi
          done

      - name: AI guard parity with native (the real post.wasm in Node)
        working-directory: .
        env:
          REPACK_REQUIRE_POST_WASM: '1'
          REPACK_POST_WASM: engine/target/wasm32-unknown-unknown/release/rt_post_wasm.wasm
        run: |
          npm ci
          npx vitest run tests/ai-post-wasm.test.ts

      - name: WebAssembly parity with native (the real module in Node)
        run: |
          # The pinned hashes of the six passes of a scene (X2), in the order of PASS_KEYS.
          pinned_passes() {
            for k in ALBEDO NORMAL DEPTH PART_ID MATERIAL_ID COC; do
              sed -n "s/.*PINNED_${1}PASS_${k}: u32 = 0x\([0-9a-f_]*\);.*/\1/p" crates/rt-core/src/render/passes_tests.rs | tr -d _
            done | paste -sd,
          }
          cargo run --release -p rt-cli -- --write-example "$RUNNER_TEMP/example.rsb"
          expected=$(sed -n 's/.*PINNED_EXAMPLE_4SPP: u32 = 0x\([0-9a-f_]*\);.*/\1/p' crates/rt-core/src/render.rs | tr -d _)
          test -n "$expected"
          passes=$(pinned_passes "")
          test "$(echo "$passes" | tr , '\n' | grep -c .)" = 6
          # The image alone, then with every pass interleaved (it must keep its hash).
          node tools/wasm-parity.mjs target/wasm32-unknown-unknown/release/rt_wasm.wasm "$RUNNER_TEMP/example.rsb" --expect "$expected"
          node tools/wasm-parity.mjs target/wasm32-unknown-unknown/release/rt_wasm.wasm "$RUNNER_TEMP/example.rsb" --expect "$expected" --expect-passes "$passes"
          # E5: glass, cut-outs, anisotropy, an HDRI read from its RGBE bytes, a background image.
          cargo run --release -p rt-cli -- --write-e5-example "$RUNNER_TEMP/e5.rsb"
          expected=$(sed -n 's/.*PINNED_E5_HDRI_4SPP: u32 = 0x\([0-9a-f_]*\);.*/\1/p' crates/rt-core/src/render.rs | tr -d _)
          test -n "$expected"
          passes=$(pinned_passes "E5_")
          test "$(echo "$passes" | tr , '\n' | grep -c .)" = 6
          node tools/wasm-parity.mjs target/wasm32-unknown-unknown/release/rt_wasm.wasm "$RUNNER_TEMP/e5.rsb" --expect "$expected" --expect-passes "$passes"
          # E5c: the E5 sky scene under the physical sky (the table of rt-core/src/sky_table.rs),
          # alone and with the passes interleaved (the image keeps its hash).
          cargo run --release -p rt-cli -- --write-e5c-example "$RUNNER_TEMP/e5c.rsb"
          expected=$(sed -n 's/.*PINNED_E5C_SKY_4SPP: u32 = 0x\([0-9a-f_]*\);.*/\1/p' crates/rt-core/src/render.rs | tr -d _)
          test -n "$expected"
          node tools/wasm-parity.mjs target/wasm32-unknown-unknown/release/rt_wasm.wasm "$RUNNER_TEMP/e5c.rsb" --expect "$expected"
          node tools/wasm-parity.mjs target/wasm32-unknown-unknown/release/rt_wasm.wasm "$RUNNER_TEMP/e5c.rsb" --expect "$expected" --passes
          # E5b-1: the E5 scene with caustics (the module traces each sample's photon map), and the
          # example denoised as the page's pool does it (rt_denoise in three bands with their halo).
          cargo run --release -p rt-cli -- --write-e5b-example "$RUNNER_TEMP/e5b.rsb"
          expected=$(sed -n 's/.*PINNED_E5B_CAUSTICS_4SPP: u32 = 0x\([0-9a-f_]*\);.*/\1/p' crates/rt-core/src/render.rs | tr -d _)
          test -n "$expected"
          node tools/wasm-parity.mjs target/wasm32-unknown-unknown/release/rt_wasm.wasm "$RUNNER_TEMP/e5b.rsb" --expect "$expected"
          # E6: the edge bevel (CAD-like parts, every edge rounded in the shading), alone and with
          # every pass interleaved (the normal pass carries the bevel).
          cargo run --release -p rt-cli -- --write-e6-example "$RUNNER_TEMP/e6.rsb"
          expected=$(sed -n 's/.*PINNED_E6_BEVEL_4SPP: u32 = 0x\([0-9a-f_]*\);.*/\1/p' crates/rt-core/src/render.rs | tr -d _)
          test -n "$expected"
          passes=$(pinned_passes "E6_")
          test "$(echo "$passes" | tr , '\n' | grep -c .)" = 6
          node tools/wasm-parity.mjs target/wasm32-unknown-unknown/release/rt_wasm.wasm "$RUNNER_TEMP/e6.rsb" --expect "$expected"
          node tools/wasm-parity.mjs target/wasm32-unknown-unknown/release/rt_wasm.wasm "$RUNNER_TEMP/e6.rsb" --expect "$expected" --expect-passes "$passes"
          # E6: the procedural patterns (wood), alone and with the passes (the albedo is the
          # pattern's colour).
          cargo run --release -p rt-cli -- --write-e6-patterns-example "$RUNNER_TEMP/e6p.rsb"
          expected=$(sed -n 's/.*PINNED_E6_PATTERNS_4SPP: u32 = 0x\([0-9a-f_]*\);.*/\1/p' crates/rt-core/src/render.rs | tr -d _)
          test -n "$expected"
          node tools/wasm-parity.mjs target/wasm32-unknown-unknown/release/rt_wasm.wasm "$RUNNER_TEMP/e6p.rsb" --expect "$expected"
          node tools/wasm-parity.mjs target/wasm32-unknown-unknown/release/rt_wasm.wasm "$RUNNER_TEMP/e6p.rsb" --expect "$expected" --passes
          expected=$(sed -n 's/.*PINNED_EXAMPLE_4SPP: u32 = 0x\([0-9a-f_]*\);.*/\1/p' crates/rt-core/src/render.rs | tr -d _)
          denoised=$(sed -n 's/.*PINNED_DENOISED_EXAMPLE_4SPP: u32 = 0x\([0-9a-f_]*\);.*/\1/p' crates/rt-post/src/denoise/tests.rs | tr -d _)
          test -n "$expected" && test -n "$denoised"
          node tools/wasm-parity.mjs target/wasm32-unknown-unknown/release/rt_wasm.wasm "$RUNNER_TEMP/example.rsb" --expect "$expected" --denoise --expect-denoised "$denoised"

      - name: Passes through the page's own code (the real rt.wasm in Node)
        working-directory: .
        env:
          REPACK_REQUIRE_RT_WASM: '1'
          REPACK_RT_WASM: engine/target/wasm32-unknown-unknown/release/rt_wasm.wasm
        run: npx vitest run tests/passes-engine.test.ts tests/denoise.test.ts

      - name: Tests on WebAssembly, scalar and simd128 (Node WASI)
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: node ${{ github.workspace }}/engine/tools/wasi-run.mjs
        run: |
          cargo test -p rt-core --release --target wasm32-wasip1
          RUSTFLAGS="-C target-feature=+simd128" cargo test -p rt-core --release --target wasm32-wasip1

      - name: Ray throughput (smoke run of rt-bench)
        run: cargo run --release -p rt-cli --bin rt-bench -- --rays 200000 --triangles 200000

      - name: Cross-check aarch64
        run: cargo check --workspace --target aarch64-unknown-linux-gnu

      - name: Cross-check riscv64
        run: cargo check --workspace --target riscv64gc-unknown-linux-gnu

      # The desktop launcher (rt-app) has Windows-only code (registry, Edge, no console): keep it
      # compiling and lint-clean on every push. Linking the .exe is the release's job.
      - name: Cross-check Windows (x86_64-pc-windows-gnu)
        run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-gnu -- -D warnings

      - name: Render the example scene
        run: |
          mkdir -p ../out
          cargo run --release -p rt-cli -- --example -o ../out/engine-example.png

      - name: Upload the example render
        uses: actions/upload-artifact@v4
        with:
          name: engine-example
          path: out/engine-example.png
          if-no-files-found: error

      - name: Contact sheet (six built-in light recipes, the E5 scenes and the E5c skies)
        run: cargo run --release -p rt-cli -- --sheet ../out/sheet

      - name: Upload the contact sheet
        uses: actions/upload-artifact@v4
        with:
          name: engine-contact-sheet
          path: out/sheet
          if-no-files-found: error

      - name: Upload the WebAssembly engine
        uses: actions/upload-artifact@v4
        with:
          name: engine-wasm
          path: engine/target/wasm32-unknown-unknown/release/rt_wasm.wasm
          if-no-files-found: error
