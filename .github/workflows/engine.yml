# Engine CI: the Rust render engine in `engine/`.
#
# The engine promises to run on any OS and any CPU architecture. That promise is checked here by
# cross-compiling the whole workspace for WebAssembly (built and inspected), aarch64 and riscv64
# on every push, next to the native format, lint, test and release build.
#
# The SIMD paths that this x86_64 runner can execute (scalar, SSE2, AVX2) are tested natively;
# the WebAssembly `simd128` path is executed too, by running the rt-core tests as a
# `wasm32-wasip1` binary under Node's WASI (tools/wasi-run.mjs). NEON is compile-checked only.
# The real `rt_wasm.wasm` renders the example scene in Node and must give the film hash the native
# tests pin (tools/wasm-parity.mjs). The contact sheet of the six built-in light recipes is
# rendered and uploaded on every run.
#
# The engine also promises zero external dependencies. That rule is checked by requiring that
# Cargo.lock contains only workspace members: a `[[package]]` with a `source =` line is a crate
# from a registry or from git, and the "Zero external dependencies" step fails on it.
#
# The toolchain is pinned (RUST_VERSION, the same as the development machines): a new stable
# brings new clippy lints, and `-D warnings` would turn every release of Rust into a red CI that
# no change caused. Moving to a newer Rust is a deliberate change that fixes its new lints.
name: Engine

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: 1.97.0
  # Wins over engine/rust-toolchain.toml (channel "stable"), so every cargo call uses the pin.
  RUSTUP_TOOLCHAIN: 1.97.0

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, wasm32-wasip1, aarch64-unknown-linux-gnu, riscv64gc-unknown-linux-gnu, x86_64-pc-windows-gnu

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Zero external dependencies
        run: |
          if grep -n '^source = ' Cargo.lock; then
            echo "::error file=engine/Cargo.lock::Cargo.lock lists a crate from a registry or git. The engine must depend on nothing but the workspace crates and std."
            exit 1
          fi

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Test (release)
        run: cargo test --workspace --release

      - name: Release build of the CLI
        run: cargo build --release -p rt-cli

      - name: WebAssembly release build
        run: cargo build -p rt-wasm --target wasm32-unknown-unknown --release

      - name: WebAssembly binary has no OS imports
        run: |
          if grep -q wasi_snapshot_preview1 target/wasm32-unknown-unknown/release/rt_wasm.wasm; then
            echo "::error::rt_wasm.wasm imports WASI functions. The engine must not use OS APIs."
            exit 1
          fi

      - name: WebAssembly parity with native (the real module in Node)
        run: |
          cargo run --release -p rt-cli -- --write-example "$RUNNER_TEMP/example.rsb"
          expected=$(sed -n 's/.*PINNED_EXAMPLE_4SPP: u32 = 0x\([0-9a-f_]*\);.*/\1/p' crates/rt-core/src/render.rs | tr -d _)
          test -n "$expected"
          node tools/wasm-parity.mjs target/wasm32-unknown-unknown/release/rt_wasm.wasm "$RUNNER_TEMP/example.rsb" --expect "$expected"

      - name: Tests on WebAssembly, scalar and simd128 (Node WASI)
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: node ${{ github.workspace }}/engine/tools/wasi-run.mjs
        run: |
          cargo test -p rt-core --release --target wasm32-wasip1
          RUSTFLAGS="-C target-feature=+simd128" cargo test -p rt-core --release --target wasm32-wasip1

      - name: Ray throughput (smoke run of rt-bench)
        run: cargo run --release -p rt-cli --bin rt-bench -- --rays 200000 --triangles 200000

      - name: Cross-check aarch64
        run: cargo check --workspace --target aarch64-unknown-linux-gnu

      - name: Cross-check riscv64
        run: cargo check --workspace --target riscv64gc-unknown-linux-gnu

      # The desktop launcher (rt-app) has Windows-only code (registry, Edge, no console): keep it
      # compiling and lint-clean on every push. Linking the .exe is the release's job.
      - name: Cross-check Windows (x86_64-pc-windows-gnu)
        run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-gnu -- -D warnings

      - name: Render the example scene
        run: |
          mkdir -p ../out
          cargo run --release -p rt-cli -- --example -o ../out/engine-example.png

      - name: Upload the example render
        uses: actions/upload-artifact@v4
        with:
          name: engine-example
          path: out/engine-example.png
          if-no-files-found: error

      - name: Contact sheet (six built-in light recipes)
        run: cargo run --release -p rt-cli -- --sheet ../out/sheet

      - name: Upload the contact sheet
        uses: actions/upload-artifact@v4
        with:
          name: engine-contact-sheet
          path: out/sheet
          if-no-files-found: error

      - name: Upload the WebAssembly engine
        uses: actions/upload-artifact@v4
        with:
          name: engine-wasm
          path: engine/target/wasm32-unknown-unknown/release/rt_wasm.wasm
          if-no-files-found: error
