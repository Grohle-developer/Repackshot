name: QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Rule number one of this project: no change ships without the suite green.
  # Until this workflow existed that was a convention; here it becomes a gate.
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

      # Lets anyone try the UI of any commit without a release.
      - uses: actions/upload-artifact@v4
        with:
          name: repackshot-${{ github.sha }}
          path: dist/
          if-no-files-found: error
