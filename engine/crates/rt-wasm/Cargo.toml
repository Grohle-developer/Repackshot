[package]
name = "rt-wasm"
description = "WebAssembly build of the Repackshot engine: hand-written C ABI exports, no wasm-bindgen."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rt-core = { path = "../rt-core" }
# The denoiser (E5b-1): only `rt_post::denoise` ends up in the module.
rt-post = { path = "../rt-post" }
# The particles of an ambient effect for the Fast preview (S4a, `rt_particles_eval`).
rt-sim = { path = "../rt-sim" }
