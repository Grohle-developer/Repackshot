[package]
name = "rt-app"
description = "The Repackshot desktop launcher: serves the interface on 127.0.0.1, opens it in an app window, renders natively with rt-core, stores AI models and detects the hardware. std only."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
name = "rt_app"
path = "src/lib.rs"

[[bin]]
name = "repackshot"
path = "src/main.rs"

# A stand-in for stable-diffusion.cpp's sd-cli and sd-server in the tests (tests/ai.rs); never
# shipped (packaging/release.mjs copies `repackshot` only).
[[bin]]
name = "rt-fake-sd"
path = "src/bin/rt-fake-sd.rs"
test = false
doc = false

[dependencies]
rt-core = { path = "../rt-core" }

[dev-dependencies]
# Parity: the launcher's native renderer must give exactly the film of `rt`.
rt-cli = { path = "../rt-cli" }
