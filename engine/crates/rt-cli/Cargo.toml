[package]
name = "rt-cli"
description = "Native command line front end of the Repackshot engine: reads an .rsb scene, writes a PNG."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "rt"

[lib]
name = "rt_cli"
path = "src/lib.rs"

[[bin]]
name = "rt"
path = "src/main.rs"

[[bin]]
name = "rt-bench"
path = "src/bin/rt-bench.rs"

[dependencies]
rt-core = { path = "../rt-core" }
