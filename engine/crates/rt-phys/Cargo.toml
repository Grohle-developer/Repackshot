[package]
name = "rt-phys"
description = "Repackshot simulator: rigid bodies (S2: extended position based dynamics, own quickhull, separating-axis contacts, sleeping) and cloth (S9: XPBD sheets). std only, no unsafe, deterministic f32."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The vector type and the deterministic maths (fmath) the engine already has, so a pose is the same
# bits natively and in WebAssembly.
rt-core = { path = "../rt-core" }
# S9: the gusts of the wind on the cloth are the ambient effects' turbulence (S4a, `noise::curl`).
rt-sim = { path = "../rt-sim" }
